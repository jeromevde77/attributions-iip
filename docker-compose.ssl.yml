# ⚠️ HÉRITAGE — INSTALLATION NAS SYNOLOGY, HORS SERVICE DEPUIS LE 17/09/2026.
# Lucie tourne désormais sur un VPS OVH, derrière Caddy : voir
# `docker-compose.vps.yml` (production), `docker-compose.vps.dev.yml`
# (développement) et `Caddyfile.vps`. Ce fichier est conservé pour mémoire ;
# il ne décrit plus l'installation en service.
# =================================================================
# docker-compose PROD avec SSL DIRECT dans nginx (sans reverse proxy DSM)
#
# Le frontend nginx écoute en HTTPS sur le port 10800.
# Port-forward routeur : 443 (ou 10800) → IP_NAS:10800
#
# Bascule : remplacer docker-compose.yml par celui-ci, ou lancer avec -f.
# Retour arrière : relancer avec l'ancien docker-compose.yml (port 8080 + reverse proxy).
# =================================================================

services:
  backend:
    image: ghcr.io/jeromevde77/attributions-backend:latest
    pull_policy: always
    container_name: attributions-backend
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-please}
      # LA CLÉ QUI CHIFFRE LES SECRETS DU SECOND FACTEUR (32 octets, base64).
      # Sans elle, le backend REFUSE DE DÉMARRER — volontairement : il ne doit
      # pas accepter des enrôlements qu'il ne saurait pas relire.
      # Fabriquer :  node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # ELLE NE SE CHANGE PAS : une nouvelle clé rend illisibles tous les
      # secrets déjà enrôlés, et chacun doit reconfigurer son application.
      MFA_KEY: ${MFA_KEY:?MFA_KEY manquant — 32 octets en base64}
      DB_PATH: /app/data/attributions.db
      CORS_ORIGIN: ${CORS_ORIGIN:-https://www.lucie-iip.be,https://lucie-iip.be}
    volumes:
      - ./backend/data:/app/data
    expose:
      - "3001"
    networks:
      - attributions-net

  frontend:
    image: ghcr.io/jeromevde77/attributions-frontend:latest
    pull_policy: always
    container_name: attributions-frontend
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    depends_on:
      - backend
    ports:
      - "10800:443"          # HTTPS direct dans nginx
    volumes:
      # Certificat SSL DSM monté en lecture seule
      - /usr/syno/etc/certificate/system/default/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /usr/syno/etc/certificate/system/default/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      # Config nginx SSL (remplace la config HTTP par défaut)
      - ./nginx-prod-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - attributions-net

networks:
  attributions-net:
    driver: bridge
