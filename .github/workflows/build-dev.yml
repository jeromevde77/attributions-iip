name: Build & Push Docker images (develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-and-push-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lire la version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend ---
      - name: Générer le changelog depuis Git
        run: git log -100 --pretty=format:'%H%x09%aI%x09%s' > backend/git-changelog.tsv

      # --- Frontend D'ABORD (30 octobre 2026) ---
      # La dev se met à jour dès que l'image du backend paraît ; publiée avant celle du frontend, elle relançait la dev
      # avec l'ancien frontend (badge « 3.1.503 ≠ 3.1.504 », trois fois le même jour). Le frontend passe donc devant.
      - name: Build & push frontend (dev)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/attributions-frontend:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/attributions-frontend:dev-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}-dev+${{ github.sha }}
          cache-from: type=gha,scope=frontend-dev
          cache-to: type=gha,scope=frontend-dev,mode=max

      # --- Backend ---
      - name: Build & push backend (dev)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/attributions-backend:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/attributions-backend:dev-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}-dev
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,scope=backend-dev,mode=max

      # LE PORTAIL DES ÉTUDIANTS (3.1.477, le mur) : deux images à part — le serveur (dossier portail/, rien de
      # Lucie) et le site (frontend/Dockerfile.portail, la seule entrée portail.html).
      - name: Build & push portail — serveur-dev
        uses: docker/build-push-action@v5
        with:
          context: ./portail
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/lucie-portail-backend:dev
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}-dev
          cache-from: type=gha,scope=portail-backend-dev
          cache-to: type=gha,scope=portail-backend-dev,mode=max

      - name: Build & push portail — site-dev
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.portail
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/lucie-portail-frontend:dev
          cache-from: type=gha,scope=portail-frontend-dev
          cache-to: type=gha,scope=portail-frontend-dev,mode=max

      - name: Summary
        run: |
          echo "### Images DEV publiées" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.IMAGE_NAMESPACE }}/attributions-backend:dev\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.IMAGE_NAMESPACE }}/attributions-frontend:dev\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Ces images alimentent l'environnement de développement (port 10801 sur le NAS)." >> $GITHUB_STEP_SUMMARY
