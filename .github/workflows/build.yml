name: Build & Push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:  # permet de lancer manuellement depuis l'UI GitHub

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser sur ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lire la version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend ---
      - name: Générer le changelog depuis Git
        run: git log -100 --pretty=format:'%H%x09%aI%x09%s' > backend/git-changelog.tsv

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/attributions-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/attributions-backend:${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # --- Frontend ---
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/attributions-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/attributions-frontend:${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}+${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # LE PORTAIL DES ÉTUDIANTS (3.1.477, le mur) : deux images à part — le serveur (dossier portail/, rien de
      # Lucie) et le site (frontend/Dockerfile.portail, la seule entrée portail.html).
      - name: Build & push portail — serveur
        uses: docker/build-push-action@v5
        with:
          context: ./portail
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/lucie-portail-backend:latest
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=portail-backend
          cache-to: type=gha,scope=portail-backend,mode=max

      - name: Build & push portail — site
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.portail
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/lucie-portail-frontend:latest
          cache-from: type=gha,scope=portail-frontend
          cache-to: type=gha,scope=portail-frontend,mode=max

      - name: Summary
        run: |
          echo "### Images publiées" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.IMAGE_NAMESPACE }}/attributions-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.IMAGE_NAMESPACE }}/attributions-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
