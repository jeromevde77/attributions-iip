# ⚠️ HÉRITAGE — INSTALLATION NAS SYNOLOGY, HORS SERVICE DEPUIS LE 17/09/2026.
# Lucie tourne désormais sur un VPS OVH, derrière Caddy : voir
# `docker-compose.vps.yml` (production), `docker-compose.vps.dev.yml`
# (développement) et `Caddyfile.vps`. Ce fichier est conservé pour mémoire ;
# il ne décrit plus l'installation en service.
# =================================================================
# docker-compose pour Synology — utilise les images publiées sur GHCR
# (= déploiement automatique via GitHub Actions)
#
# À placer dans /volume1/docker/attributions-app/docker-compose.yml
# en lieu et place du fichier "build:" original.
# =================================================================

services:
  backend:
    image: ghcr.io/jeromevde77/attributions-backend:latest
    pull_policy: always
    container_name: attributions-backend
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-please}
      # LA CLÉ QUI CHIFFRE LES SECRETS DU SECOND FACTEUR (32 octets, base64).
      # Sans elle, le backend REFUSE DE DÉMARRER — volontairement : il ne doit
      # pas accepter des enrôlements qu'il ne saurait pas relire.
      # Fabriquer :  node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # ELLE NE SE CHANGE PAS : une nouvelle clé rend illisibles tous les
      # secrets déjà enrôlés, et chacun doit reconfigurer son application.
      MFA_KEY: ${MFA_KEY:?MFA_KEY manquant — 32 octets en base64}
      DB_PATH: /app/data/attributions.db
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - ./backend/data:/app/data
    expose:
      - "3001"
    networks:
      - attributions-net

  frontend:
    image: ghcr.io/jeromevde77/attributions-frontend:latest
    pull_policy: always
    container_name: attributions-frontend
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks:
      - attributions-net

networks:
  attributions-net:
    driver: bridge
