# /opt/lucie/docker-compose.yml — COPIE DE RÉFÉRENCE DE CE QUI TOURNE SUR LE VPS.
#
# Dev ET prod sur le même VPS, chacun sur son réseau ; Caddy rejoint les deux et
# fait seul la façade. Aucun port publié sauf le sien (Docker écrit ses propres
# règles iptables et court-circuite UFW : un port publié serait exposé à
# Internet malgré le pare-feu).
#
#   - backend  écoute en 3001
#   - frontend écoute en 80 (pas de TLS dans l'image : Caddy termine le TLS)
#   - alias réseau "backend" : nginx fait proxy_pass vers ce nom → obligatoire
#   - sauvegardes hors du volume Docker
#   - TZ=Europe/Brussels, sinon les horodatages décalent de deux heures
#
# LES IMAGES NE SE METTENT PAS À JOUR SEULES. `restart: unless-stopped` relance
# le conteneur, il ne va pas chercher une image plus récente : après un build,
# il faut `docker compose pull` PUIS `docker compose up -d`.

services:

  caddy:
    image: caddy:2-alpine
    container_name: lucie-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Les deux portails (3.1.477) : Caddy est le SEUL conteneur qui touche à la fois Lucie et le portail.
    networks: [lucie-prod, lucie-dev, lucie-portail, lucie-portail-dev]

  # ----------------------------------------------------------------- DEV
  backend-dev:
    image: ghcr.io/jeromevde77/attributions-backend:dev
    container_name: attributions-backend-dev
    restart: unless-stopped
    environment:
      # UN COURRIEL PARTI DE DEV DOIT RAMENER SUR DEV. Sans cette ligne, le
      # repli inscrit dans le code envoie le destinataire en PRODUCTION : un
      # essai qui fait atterrir quelqu'un sur les données réelles est pire
      # qu'un lien mort.
      LUCIE_URL: https://dev.lucie-iip.be
      NODE_ENV: development
      # LE CONTRÔLE DES MODULES : « constat » ou « strict ».
      #
      # constat (le défaut, quand la ligne est absente) — le garde LAISSE
      #   PASSER et note ce qu'il aurait refusé, dans Configuration → Rôles et
      #   plafonds → « Ce que le contrôle a vu ». C'est ce qu'on déploie
      #   d'abord : fermer soixante-douze portes d'un coup, c'est découvrir le
      #   lundi matin — par le secrétariat — ce qu'on a fermé.
      # strict — les refus s'appliquent.
      #
      # DEV D'ABORD, ET PENDANT QUELQUES JOURS. La carte des modules est une
      # interprétation : « /api/aa relève-t-il de l'organisation ou des
      # étudiants ? » se tranche sur des refus observés, pas sur une intuition.
      PERMISSIONS_MODE: strict
      TZ: Europe/Brussels
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET_DEV:?JWT_SECRET_DEV manquant dans .env}
      # Le portail des étudiants de dev (3.1.477), par le port interne de Caddy (voir plus bas).
      PORTAIL_INTERNE_URL: http://caddy:8444
      PORTAIL_URL_PUBLIQUE: https://etudiant-dev.lucie-iip.be
      PORTAIL_JETON: ${PORTAIL_JETON_DEV:-}
      # LA CLÉ QUI CHIFFRE LES SECRETS DU SECOND FACTEUR (32 octets, base64).
      # Sans elle, le backend REFUSE DE DÉMARRER — volontairement : il ne doit
      # pas accepter des enrôlements qu'il ne saurait pas relire.
      # Fabriquer :  node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      #
      # LA MÊME CLÉ POUR DEV ET POUR PROD, ET C'EST VOULU. La base de dev est
      # une COPIE de celle de prod : on télécharge une sauvegarde de production
      # et on la restaure sur dev (Configuration → Sauvegardes). Avec deux clés
      # distinctes, chacune de ces restaurations rendrait illisibles TOUS les
      # secrets déjà enrôlés — tout le monde enfermé dehors sur dev, sans que
      # rien n'en dise la cause. Et séparer ne protégerait rien : dev porte déjà
      # les données réelles et les empreintes de mots de passe, sur le même VPS,
      # depuis le même .env.
      #
      # ELLE NE SE CHANGE PAS : une nouvelle clé rend illisibles tous les
      # secrets déjà enrôlés, et chacun doit reconfigurer son application.
      MFA_KEY: ${MFA_KEY:?MFA_KEY manquant dans .env}
    volumes:
      - ./dev/data:/app/data
      - ./dev/backups:/app/data/backups
    mem_limit: 768m
    networks:
      lucie-dev:
        aliases:
          - backend

  frontend-dev:
    image: ghcr.io/jeromevde77/attributions-frontend:dev
    container_name: attributions-frontend-dev
    restart: unless-stopped
    environment:
      TZ: Europe/Brussels
    networks: [lucie-dev]

  # ---------------------------------------------------------------- PROD
  backend:
    image: ghcr.io/jeromevde77/attributions-backend:latest
    container_name: attributions-backend
    restart: unless-stopped
    environment:
      # Déclarée plutôt que laissée au repli du code : l'adresse qui part dans
      # des dizaines de courriels ne doit pas dépendre d'une valeur par défaut
      # qu'une version ultérieure pourrait changer.
      LUCIE_URL: https://www.lucie-iip.be
      NODE_ENV: production
      # Constaté le 21 septembre 2026 sur le serveur : la production est en
      # strict. Cette copie ne le disait pas, et l'on a cru le contraire.
      PERMISSIONS_MODE: strict
      TZ: Europe/Brussels
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET_PROD:?JWT_SECRET_PROD manquant dans .env}
      # LE JETON QUI LAISSE L'ASSISTANT LIRE LES IDÉES (3.1.470, GET /api/suggestions/flux, en-tête
      # X-Lucie-Jeton). Facultatif : vide ou absent, l'adresse répond 404. 32 caractères au moins.
      # Fabriquer :  node -e "console.log(require('crypto').randomBytes(24).toString('hex'))"
      # La même valeur va dans les secrets de l'environnement de l'assistant, sous le même nom.
      LUCIE_IDEES_JETON: ${LUCIE_IDEES_JETON:-}
      # LE PORTAIL DES ÉTUDIANTS (3.1.477, le mur). Lucie va vers lui, jamais l'inverse : par le port interne
      # de Caddy (8443, non publié), qui ne mène qu'au port interne du portail. Sans jeton, rien ne passe.
      PORTAIL_INTERNE_URL: http://caddy:8443
      PORTAIL_URL_PUBLIQUE: https://etudiant.lucie-iip.be
      PORTAIL_JETON: ${PORTAIL_JETON_PROD:-}
      # LA CLÉ QUI CHIFFRE LES SECRETS DU SECOND FACTEUR (32 octets, base64).
      # Sans elle, le backend REFUSE DE DÉMARRER — volontairement : il ne doit
      # pas accepter des enrôlements qu'il ne saurait pas relire.
      # Fabriquer :  node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      #
      # LA MÊME CLÉ POUR DEV ET POUR PROD, ET C'EST VOULU. La base de dev est
      # une COPIE de celle de prod : on télécharge une sauvegarde de production
      # et on la restaure sur dev (Configuration → Sauvegardes). Avec deux clés
      # distinctes, chacune de ces restaurations rendrait illisibles TOUS les
      # secrets déjà enrôlés — tout le monde enfermé dehors sur dev, sans que
      # rien n'en dise la cause. Et séparer ne protégerait rien : dev porte déjà
      # les données réelles et les empreintes de mots de passe, sur le même VPS,
      # depuis le même .env.
      #
      # ELLE NE SE CHANGE PAS : une nouvelle clé rend illisibles tous les
      # secrets déjà enrôlés, et chacun doit reconfigurer son application.
      MFA_KEY: ${MFA_KEY:?MFA_KEY manquant dans .env}
    volumes:
      - ./prod/data:/app/data
      - ./prod/backups:/app/data/backups
    networks:
      lucie-prod:
        aliases:
          - backend

  frontend:
    image: ghcr.io/jeromevde77/attributions-frontend:latest
    container_name: attributions-frontend
    restart: unless-stopped
    environment:
      TZ: Europe/Brussels
    networks: [lucie-prod]

  # ════════════════════════════════════════════════════════════════════════
  # LE PORTAIL DES ÉTUDIANTS — DE L'AUTRE CÔTÉ DU MUR (3.1.477, Charles : « un mur de Berlin infranchissable »).
  # Deux conteneurs par environnement, sur un réseau qui n'est PAS celui de Lucie : ils ne voient ni son
  # backend, ni sa base, ni ses volumes ; ils n'ont ni JWT_SECRET, ni MFA_KEY, ni serveur de courriel. Leur
  # base (portail.db) est à eux, dans leur dossier. Lucie les atteint par Caddy (port interne), jamais l'inverse.
  # Deux secrets propres, qui ne servent nulle part ailleurs (32 caractères au moins, différents) :
  #   node -e "console.log(require('crypto').randomBytes(24).toString('hex'))"
  # PORTAIL_JETON_* est aussi donné à Lucie (le passage) ; PORTAIL_SECRET_* signe les sessions des étudiants
  # et ne sort jamais du portail.
  # ════════════════════════════════════════════════════════════════════════
  portail-backend:
    image: ghcr.io/jeromevde77/lucie-portail-backend:latest
    container_name: lucie-portail-backend
    restart: unless-stopped
    environment:
      PORTAIL_SECRET: ${PORTAIL_SECRET_PROD:?PORTAIL_SECRET_PROD manquant dans .env}
      PORTAIL_JETON: ${PORTAIL_JETON_PROD:?PORTAIL_JETON_PROD manquant dans .env}
      PORTAIL_URL_PUBLIQUE: https://etudiant.lucie-iip.be
      TZ: Europe/Brussels
    volumes:
      - ./portail/data:/app/data
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [lucie-portail]

  portail-frontend:
    image: ghcr.io/jeromevde77/lucie-portail-frontend:latest
    container_name: lucie-portail-frontend
    restart: unless-stopped
    environment:
      TZ: Europe/Brussels
    networks: [lucie-portail]

  portail-backend-dev:
    image: ghcr.io/jeromevde77/lucie-portail-backend:dev
    container_name: lucie-portail-backend-dev
    restart: unless-stopped
    environment:
      PORTAIL_SECRET: ${PORTAIL_SECRET_DEV:?PORTAIL_SECRET_DEV manquant dans .env}
      PORTAIL_JETON: ${PORTAIL_JETON_DEV:?PORTAIL_JETON_DEV manquant dans .env}
      PORTAIL_URL_PUBLIQUE: https://etudiant-dev.lucie-iip.be
      TZ: Europe/Brussels
    volumes:
      - ./portail-dev/data:/app/data
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks:
      lucie-portail-dev:
        aliases: [portail-backend]

  portail-frontend-dev:
    image: ghcr.io/jeromevde77/lucie-portail-frontend:dev
    container_name: lucie-portail-frontend-dev
    restart: unless-stopped
    environment:
      TZ: Europe/Brussels
    networks:
      lucie-portail-dev:
        aliases: [portail-frontend]

networks:
  lucie-prod:
    driver: bridge
  lucie-dev:
    driver: bridge
  lucie-portail:
    driver: bridge
  lucie-portail-dev:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
