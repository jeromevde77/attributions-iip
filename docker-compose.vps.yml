# /opt/lucie/docker-compose.yml — COPIE DE RÉFÉRENCE DE CE QUI TOURNE SUR LE VPS.
#
# Dev ET prod sur le même VPS, chacun sur son réseau ; Caddy rejoint les deux et
# fait seul la façade. Aucun port publié sauf le sien (Docker écrit ses propres
# règles iptables et court-circuite UFW : un port publié serait exposé à
# Internet malgré le pare-feu).
#
#   - backend  écoute en 3001
#   - frontend écoute en 80 (pas de TLS dans l'image : Caddy termine le TLS)
#   - alias réseau "backend" : nginx fait proxy_pass vers ce nom → obligatoire
#   - sauvegardes hors du volume Docker
#   - TZ=Europe/Brussels, sinon les horodatages décalent de deux heures
#
# LES IMAGES NE SE METTENT PAS À JOUR SEULES. `restart: unless-stopped` relance
# le conteneur, il ne va pas chercher une image plus récente : après un build,
# il faut `docker compose pull` PUIS `docker compose up -d`.

services:

  caddy:
    image: caddy:2-alpine
    container_name: lucie-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [lucie-prod, lucie-dev]

  # ----------------------------------------------------------------- DEV
  backend-dev:
    image: ghcr.io/jeromevde77/attributions-backend:dev
    container_name: attributions-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      TZ: Europe/Brussels
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET_DEV:?JWT_SECRET_DEV manquant dans .env}
      # UN COURRIEL PARTI DE DEV DOIT RAMENER SUR DEV. Sans cette ligne, le
      # repli inscrit dans le code envoie le destinataire en PRODUCTION : un
      # essai qui fait atterrir quelqu'un sur les données réelles est pire
      # qu'un lien mort.
      LUCIE_URL: https://dev.lucie-iip.be
    volumes:
      - ./dev/data:/app/data
      - ./dev/backups:/app/data/backups
    mem_limit: 768m
    networks:
      lucie-dev:
        aliases:
          - backend

  frontend-dev:
    image: ghcr.io/jeromevde77/attributions-frontend:dev
    container_name: attributions-frontend-dev
    restart: unless-stopped
    environment:
      TZ: Europe/Brussels
    networks: [lucie-dev]

  # ---------------------------------------------------------------- PROD
  backend:
    image: ghcr.io/jeromevde77/attributions-backend:latest
    container_name: attributions-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Europe/Brussels
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET_PROD:?JWT_SECRET_PROD manquant dans .env}
      # Déclarée plutôt que laissée au repli du code : l'adresse qui part dans
      # des dizaines de courriels ne doit pas dépendre d'une valeur par défaut
      # qu'une version ultérieure pourrait changer.
      LUCIE_URL: https://www.lucie-iip.be
    volumes:
      - ./prod/data:/app/data
      - ./prod/backups:/app/data/backups
    networks:
      lucie-prod:
        aliases:
          - backend

  frontend:
    image: ghcr.io/jeromevde77/attributions-frontend:latest
    container_name: attributions-frontend
    restart: unless-stopped
    environment:
      TZ: Europe/Brussels
    networks: [lucie-prod]

networks:
  lucie-prod:
    driver: bridge
  lucie-dev:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
