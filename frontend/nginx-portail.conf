# LE SITE DES ÉTUDIANTS (3.1.477, le mur). Il ne sert que le site étudiant, et ne relaie que /api/portail/ —
# vers le portail, jamais vers Lucie (qu'il ne peut d'ailleurs pas joindre : il n'est pas sur son réseau).
# LES ENSEIGNANTS (3.5.076) : le même site derrière le mur, sa propre page selon l'adresse (enseignants.lucie-iip.be).
map $host $page_portail {
    ~^enseignants   /enseignants.html;
    default         /portail.html;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index portail.html;
    client_max_body_size 1M;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / { try_files $uri $page_portail; }
    location = /enseignants.html { add_header Cache-Control "no-store" always; add_header X-Frame-Options DENY always; add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always; }
    location = /portail.html { add_header Cache-Control "no-store" always; add_header X-Frame-Options DENY always; add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    # Les manifestes de l'écran d'accueil (3.5.090) : leur type, et jamais de cache.
    location ~ ^/manifest-(etudiants|enseignants)\.webmanifest$ { default_type application/manifest+json; add_header Cache-Control "no-cache" always; }

    # LE CENTRE DE DOCUMENTS (3.5.403) : une pièce se compose à la demande, parfois plus d'une minute.
    location /api/portail/centre {
        proxy_pass http://portail-backend:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /api/portail/ {
        proxy_pass http://portail-backend:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Les pièces d'une demande de valorisation (3.1.514) et les remises du TFE (3.5.081) : 25 Mo au plus, ici seulement.
    location ~ ^/api/portail/(va/piece|tfe/remise|amenagement)$ {
        client_max_body_size 26M;
        proxy_pass http://portail-backend:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # L'espace enseignant (3.5.076) : ses routes vont au même portail.
    location /api/enseignant/ {
        proxy_pass http://portail-backend:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # LE RELAIS DE MES COURS (3.5.137) : une requête peut porter un texte long ou un fichier ; la réponse attend Lucie (25 s au plus).
    location /api/enseignant/relais/ {
        client_max_body_size 26M;
        proxy_read_timeout 60s;
        proxy_pass http://portail-backend:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Tout autre chemin d'API n'existe pas ici.
    location /api/ { return 404; }
}
