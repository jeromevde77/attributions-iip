# LE SITE DES ÉTUDIANTS (3.1.477, le mur). Il ne sert que le site étudiant, et ne relaie que /api/portail/ —
# vers le portail, jamais vers Lucie (qu'il ne peut d'ailleurs pas joindre : il n'est pas sur son réseau).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index portail.html;
    client_max_body_size 1M;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / { try_files $uri /portail.html; }
    location = /portail.html { add_header Cache-Control "no-store" always; add_header X-Frame-Options DENY always; add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    location /api/portail/ {
        proxy_pass http://portail-backend:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Tout autre chemin d'API n'existe pas ici.
    location /api/ { return 404; }
}
